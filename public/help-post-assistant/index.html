function deckNav(){const n=C.paginate(s.coverText).length;return n>1?`<div class="deck-nav"><button data-action="prev-card" aria-label="上一张">‹</button><span>${s.deck+1} / ${n}</span><button data-action="next-card" aria-label="下一张">›</button></div>`:'';}
function fieldHTML(f){
 const value=s.values[f.id]??'',spec=C.inputSpec(f,s.demoId),p=s.parts[f.id]||{},id=esc(f.id);
 const input=(raw,placeholder,unit='',part='',label=f.label,numeric=false)=>`<div class="input-unit"><input ${part?`id="f-${id}-${part}" data-part="${part}"`:`id="f-${id}"`} data-field="${id}" aria-label="${esc(label)}" value="${esc(raw||'')}" ${numeric?'inputmode="decimal"':''} maxlength="200" placeholder="${esc(placeholder)}">${unit?`<span aria-hidden="true">${unit}</span>`:''}</div>`;
 const chips=(options,part='',multiple=false)=>`<div class="choices">${options.map(o=>{const selected=multiple?(p.selected||[]).includes(o):part?p[part]===o:value===o;return `<button class="chip ${selected?'selected':''}" aria-pressed="${selected}" data-choice="${id}" ${part?`data-choice-part="${part}"`:''} ${multiple?'data-multiple="true"':''} data-value="${esc(o)}">${esc(o)}${f.id==='term'?'个月':''}</button>`;}).join('')}</div>`;
 let control='';
 if(spec.kind==='number')control=input(value,spec.placeholder,spec.unit,'',f.label,true)+(spec.choices?chips(spec.choices):'');
 else if(spec.kind==='commute')control=chips(spec.choices,'mode')+input(value,spec.placeholder,'分钟以内','',f.label,true);
 else if(spec.kind==='travel-time')control=`<div class="split-input"><div><span class="sub-label">什么时候</span>${input(p.date,'10月中旬','','date','出行时间')}</div><div><span class="sub-label">玩几天</span>${input(value,'4','天','',f.label,true)}</div></div>`;
 else if(spec.kind==='travel-budget')control=input(value,spec.placeholder,'元','',f.label,true)+chips(['每人','总共'],'scope')+`<select data-field="${id}" data-part="includes" aria-label="预算包含范围"><option value="">是否含往返交通（选填）</option>${['不含往返交通','含往返交通'].map(o=>`<option ${p.includes===o?'selected':''}>${o}</option>`).join('')}</select>`;
 else if(spec.kind==='prices'||spec.kind==='models')control=`<div class="split-input">${['a','b'].map((part,i)=>`<div><span class="sub-label">${i?'B':'A'}款</span>${input(p[part],spec.kind==='prices'?(i?'6100':'5200'):'粘贴型号与配置',spec.kind==='prices'?'元':'',part,(i?'B':'A')+(spec.kind==='prices'?'款价格':'款型号与配置'),spec.kind==='prices')}</div>`).join('')}</div>`;
 else if(spec.kind==='multi')control=chips(spec.choices,'',true)+input(value,spec.placeholder);
 else if(spec.kind==='choice'){const custom=s.custom[f.id]||(value&&!spec.choices.includes(value));control=chips(spec.choices)+`<button class="custom-toggle" data-custom="${id}" aria-expanded="${Boolean(custom)}">${custom?'收起自定义':'自己写'}</button>`+(custom?input(value,spec.placeholder):'');}
 else control=input(value,spec.placeholder);
 return `<div class="field"><div class="field-label">${esc(f.label)}</div>${control}<small>${esc(f.reason)}</small></div>`;
}
function readValues(){return C.normalizedValues(s.analysis?.fields||[],s.values,s.parts,s.demoId);}
function getFields(){return (s.analysis?.fields||[]).filter(f=>s.editKnown||!s.analysis.facts.some(x=>x.id===f.id));}
function conflicts(values=s.pendingValues||readValues()){return (s.analysis?.facts||[]).filter(f=>values[f.id]&&C.valuesConflict(f.id,values[f.id],f.value)).map(f=>({...f,newValue:values[f.id]}));}
function renderAssist(){const target=$('#assist');if(!target)return;let html='';if(s.undo)html+=`<div class="applied-bar"><span>✓ 已融入正文，可继续编辑</span><button class="undo-btn" data-action="undo">撤销补充</button></div>`;if(s.sync)html+=`<div class="sync-bar">让图片也带上这些需求？<div class="row"><button data-action="sync">同步更新文字配图</button><button data-action="no-sync">暂不</button></div></div>`;
if(s.status){target.innerHTML=html+`<div class="busy" role="status">${esc(s.status)}</div>`;return;}if(s.error){target.innerHTML=html+`<div class="error">${esc(s.error)} <button class="text-btn" data-action="retry">重试</button><br>你仍然可以继续编辑、直接发布。</div>`;return;}
const a=s.analysis;if(!a){target.innerHTML=html;return;}if(!a.supported){target.innerHTML=html+'<div class="info">这段文字不在离线示例范围内。可选择左侧示例，或切换已配置的真实 AI 模式。正常发布不受影响。</div>';return;}if(!a.isHelp||s.dismissed){target.innerHTML=html;return;}
if(a.conflicts?.length){html+=a.conflicts.map((c,i)=>`<div class="conflict"><b>${esc(a.fields.find(f=>f.id===c.id)?.label||'条件')}有不同表述</b><p class="micro">确认采用哪一个？其余表述会同步替换，发布仍可跳过。</p>${c.values.map((v,j)=>`<button class="chip" data-resolve="${i}" data-pick="${j}">采用：${esc(v)}</button>`).join('')}</div>`).join('');}
const fields=getFields(),missing=a.fields.filter(f=>!a.facts.some(x=>x.id===f.id));
if(!missing.some(f=>f.priority==='key')&&!s.expanded){target.innerHTML=html+`<div class="recognized">${a.conflicts?.length?'可以继续编辑，或确认上面的不同条件。':'✓ 关键条件已表达，可以直接发布。'}<button data-action="expand">更多补充</button></div>`;return;}
if(!s.expanded){const key=missing.filter(f=>f.priority==='key');const names=(key.length?key:missing).slice(0,2).map(f=>f.label).join('和');target.innerHTML=html+`<div class="assist-nudge"><span class="spark">✧</span><button class="open-assist" data-action="expand">补充${esc(names)}，让建议更合适 <span>›</span></button><button class="close-nudge" data-action="dismiss" aria-label="关闭辅助提示">×</button></div>`;return;}
html+=`<section class="assist-panel"><div class="panel-head"><b>✧ 把需求说清楚一点</b><button data-action="collapse">收起</button></div><p class="micro">${esc(a.intent)} · 都可以不填，随时发布</p>`;
if(s.conflictReview){html+='<p class="micro">新信息与原文不同，只需确认这些差异。</p>';for(const f of conflicts())html+=`<div class="conflict"><b>${esc(f.label)}与原文不同</b><label><input type="radio" name="conflict-${esc(f.id)}" value="old">保留原文：${esc(f.value)}</label><label><input type="radio" name="conflict-${esc(f.id)}" value="new">采用补充：${esc(f.newValue)}</label></div>`;html+='<div class="row"><button class="secondary" data-action="cancel-conflict">返回修改</button><button class="primary" data-action="confirm">采用所选并补入</button></div>';
}else{if(a.facts.length)html+=`<div class="recognized">✓ 已识别：${a.facts.map(f=>`${esc(f.label)} ${esc(f.value)}`).join('；')}<button data-action="edit-known">修改</button></div>`;html+=fields.filter(f=>f.priority==='key').map(fieldHTML).join('');const extra=fields.filter(f=>f.priority==='optional');if(extra.length)html+=`<details class="more-fields"><summary>更多补充 · ${extra.length} 项可选</summary>${extra.map(fieldHTML).join('')}</details>`;html+='<button class="primary full" data-action="apply">补充到正文</button><p class="micro apply-help">会整理成自然表达，写入后可随时撤销。</p><button class="text-btn full" data-action="cancel-assist">取消本次填写</button>';}
target.innerHTML=html+'</section>';}
async function analyze(){cancelAnalysis();const id=seq,source=[s.title,s.body,s.idea].join('\n');s.error='';s.status=s.mode==='demo'?'正在检查示例中的已有信息…':'正在识别需求，仍可继续编辑…';renderAssist();try{let result;if(s.mode==='demo'){result=C.analyzeDemo(s);}else{controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),22000);try{const res=await fetch('/api/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({idea:s.idea,title:s.title,body:s.body}),signal:controller.signal});const data=await res.json();if(!res.ok)throw Error(data.error||'模型服务暂不可用');result=C.validateAnalysis(data,source);}finally{clearTimeout(timeout);}}
if(id!==seq||s.page!==2)return;s.analysis=result;s.status='';renderAssist();}catch(e){if(id!==seq)return;s.status='';s.error=e.name==='AbortError'?'识别超时，请重试。':e.message==='Failed to fetch'?'无法连接模型服务。请启动服务并配置接口。':e.message;renderAssist();}}
function schedule(){cancelAnalysis();s.conflictReview=false;s.analysis=null;s.error='';renderAssist();timer=setTimeout(analyze,700);}
function dialog(title,content,buttons){const div=document.createElement('div');div.className='modal-shade';div.innerHTML=`<section role="dialog" aria-modal="true" aria-label="${esc(title)}" class="dialog"><h3>${esc(title)}</h3>${content}<div class="row">${buttons}</div></section>`;$('#app').append(div);div.querySelector('button')?.focus();div.addEventListener('keydown',e=>{if(e.key==='Tab'){const els=[...div.querySelectorAll('button,input,textarea')];if(e.shiftKey&&document.activeElement===els[0]){e.preventDefault();els.at(-1).focus();}else if(!e.shiftKey&&document.activeElement===els.at(-1)){e.preventDefault();els[0].focus();}}});}
function closeDialog(){$('.modal-shade')?.remove();}
function proceedGenerate(){cancelAnalysis();s.coverText=s.idea;s.deck=0;$('#app').innerHTML=nav('生成文字配图',false)+'<div class="load-center"><div class="spinner"></div><span role="status">正在排版文字配图…</span></div>';const ticket=seq;setTimeout(()=>{if(ticket!==seq)return;s.page=1;render();notify('文字配图已生成');},350);}
function undo(){if(!s.undo)return;if(s.body!==s.undo.after){dialog('正文有新的修改','<p>这次补充之后你修改过正文。直接恢复会丢掉新修改，请选择：</p>','<button class="secondary" data-action="close-dialog">保留当前正文</button><button class="primary" data-action="force-undo">恢复补充前版本</button>');return;}applyUndo();}
function applyUndo(){const u=s.undo;Object.assign(s,{body:u.body,idea:u.idea,title:u.title,confirmed:u.confirmed,coverText:u.coverText,sync:false,undo:null,values:{},parts:{},custom:{},pendingValues:null,conflictReview:false,expanded:false});render();analyze();notify('已撤销补充，配图一并恢复');}
function confirm(){const cs=conflicts(),values={...(s.pendingValues||readValues())};let replaces=[];for(const f of cs){const chosen=$(`input[name="conflict-${f.id}"]:checked`);if(!chosen){notify('请选择如何处理与原文不同的信息');return;}if(chosen.value==='old')delete values[f.id];}
replaces=s.analysis.facts.filter(f=>values[f.id]&&!C.equivalent(f.id,values[f.id],f.value)).map(f=>({...f,newValue:values[f.id]}));
const before={body:s.body,idea:s.idea,title:s.title,confirmed:{...s.confirmed},coverText:s.coverText};for(const f of replaces){for(const key of ['body','idea','title'])s[key]=s[key].split(f.evidence).join(f.newValue);}
const additions=Object.fromEntries(Object.entries(values).filter(([id])=>!s.analysis.facts.some(f=>f.id===id)));const block=C.naturalSentences(s.analysis.fields,additions,s.demoId);if(!block&&!replaces.length){s.conflictReview=false;renderAssist();notify('保留原文，没有新增补充');return;}const appended=C.integrate({fields:s.analysis.fields,values:additions,scenario:s.demoId,body:s.body,idea:s.idea});if(appended.length>5000){Object.assign(s,before);notify('补入后正文超过 5000 字，请精简后重试');return;}s.body=appended;s.confirmed={...s.confirmed,...values};s.undo={...before,after:s.body};s.sync=true;s.expanded=false;s.conflictReview=false;s.values={};s.parts={};s.custom={};s.pendingValues=null;s.editKnown=false;render();analyze();$('.undo-btn')?.focus({preventScroll:true});notify('已将补充融入正文，可随时撤销');}
function download(){const pages=C.paginate(s.coverText);const text=pages[s.deck]||pages[0];const canvas=document.createElement('canvas');canvas.width=1080;canvas.height=1440;const ctx=canvas.getContext('2d');ctx.fillStyle={pink:'#ffe6ed',mint:'#e9f3eb',paper:'#fff7dd'}[s.theme];ctx.fillRect(0,0,1080,1440);ctx.fillStyle='#f1bcca';ctx.font='210px Georgia';ctx.fillText('“',80,200);ctx.fillStyle='#74616a';ctx.font='30px sans-serif';ctx.fillText('想听听你的建议',92,250);ctx.fillStyle='#343039';ctx.font='46px sans-serif';text.split('\n').forEach((line,i)=>ctx.fillText(line,92,365+i*78));ctx.fillStyle='#74616a';ctx.font='28px sans-serif';ctx.fillText(`${s.deck+1} / ${pages.length}`,900,1350);canvas.toBlob(blob=>{if(!blob){notify('图片导出失败，请重试');return;}const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`求助配图-${s.deck+1}.png`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('配图已导出');},'image/png');}
function save(){try{const data=JSON.parse(JSON.stringify(s));data.analysis=null;data.status='';data.error='';data.conflictReview=false;data.expanded=false;data.undo=null;localStorage.setItem(STORE,JSON.stringify({version:1,state:data}));notify('草稿已保存在此浏览器，可随时清除');}catch{notify('浏览器不允许保存，请保留当前页面');}}
$('#app').addEventListener('input',e=>{if(e.target.id==='idea')s.idea=e.target.value;if(e.target.id==='title'||e.target.id==='body'){s[e.target.id]=e.target.value;s.values={};s.parts={};s.custom={};s.pendingValues=null;s.expanded=false;schedule();}if(e.target.dataset.field){const id=e.target.dataset.field;if(e.target.dataset.part){s.parts[id]||={};s.parts[id][e.target.dataset.part]=e.target.value;}else s.values[id]=e.target.value;s.pendingValues=null;}});
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.demo){reset(b.dataset.demo);return;}if(b.dataset.variant){reset(s.demoId,Number(b.dataset.variant));return;}if(b.dataset.theme){s.theme=b.dataset.theme;render();notify('配图样式已更新');return;}if(b.dataset.custom){s.custom[b.dataset.custom]=!s.custom[b.dataset.custom];renderAssist();return;}if(b.dataset.choice){const id=b.dataset.choice;s.parts[id]||={};if(b.dataset.multiple){const picked=new Set(s.parts[id].selected||[]);picked.has(b.dataset.value)?picked.delete(b.dataset.value):picked.add(b.dataset.value);s.parts[id].selected=[...picked];}else if(b.dataset.choicePart){s.parts[id][b.dataset.choicePart]=s.parts[id][b.dataset.choicePart]===b.dataset.value?'':b.dataset.value;}else s.values[id]=s.values[id]===b.dataset.value?'':b.dataset.value;s.pendingValues=null;const scroll=$('#editor-scroll')?.scrollTop;const open=$('.more-fields')?.open;renderAssist();if(open&&$('.more-fields'))$('.more-fields').open=true;if($('#editor-scroll'))$('#editor-scroll').scrollTop=scroll;[...document.querySelectorAll('[data-choice]')].find(el=>el.dataset.choice===b.dataset.choice&&el.dataset.value===b.dataset.value)?.focus({preventScroll:true});return;}if(b.dataset.editCover!==undefined){cancelAnalysis();s.backSource=s.idea;s.idea=s.coverText;s.page=0;render();notify('返回修改配图文字，补充记录已保留');return;}
if(b.dataset.resolve!==undefined){const c=s.analysis.conflicts[Number(b.dataset.resolve)],v=c.values[Number(b.dataset.pick)];for(const key of ['idea','title','body'])for(const old of c.evidence)if(old!==v)s[key]=s[key].split(old).join(v);s.confirmed[c.id]=v;s.sync=true;s.values={};s.conflictReview=false;render();analyze();notify('已采用你确认的条件，图片等待确认更新');return;}
const a=b.dataset.action;if(!a)return;switch(a){
case 'generate':if(!s.idea.trim()){notify('先写一点你想说的内容');return;}if(s.backSource!==null&&Object.keys(s.confirmed).length&&s.idea!==s.coverText){dialog('配图文字已修改','<p>正文里的补充记录仍然保留。是否同时采用新文字作为正文？请确认预算、时间等条件是否一致。</p>','<button class="secondary" data-action="cover-only">只更新配图</button><button class="primary" data-action="cover-and-body">同时更新正文</button>');}else proceedGenerate();break;
case 'cover-only':closeDialog();s.backSource=null;proceedGenerate();break;
case 'cover-and-body':s.body=s.idea;s.undo=null;closeDialog();s.backSource=null;proceedGenerate();break;
case 'editor':s.page=2;render();analyze();break;
case 'back':cancelAnalysis();if(s.page===3)s.page=2;else if(s.page===2)s.page=1;else {s.backSource=s.idea;s.idea=s.coverText;s.page=0;}render();if(s.page===2)analyze();break;
case 'expand':s.expanded=true;renderAssist();break;
case 'collapse':s.expanded=false;s.conflictReview=false;renderAssist();break;
case 'dismiss':s.dismissed=true;renderAssist();notify('本次编辑不再提示');break;
case 'cancel-assist':s.values={};s.parts={};s.custom={};s.pendingValues=null;s.expanded=false;s.conflictReview=false;s.editKnown=false;renderAssist();notify('已取消填写，正文未改变');break;
case 'edit-known':s.editKnown=true;for(const fact of s.analysis.facts){const field=s.analysis.fields.find(f=>f.id===fact.id),draft=C.draftFromFact(field,fact.value,s.demoId);s.values[fact.id]=draft.raw;s.parts[fact.id]=draft.parts;}renderAssist();break;
case 'apply':try{s.pendingValues=readValues();if(!Object.keys(s.pendingValues).length){notify('可以先补充一项，也可以直接发布');break;}if(conflicts().length){s.conflictReview=true;renderAssist();}else confirm();}catch(error){notify(error.message);}break;
case 'cancel-conflict':s.conflictReview=false;s.pendingValues=null;renderAssist();break;
case 'confirm':confirm();break;
case 'sync':{const short={place:'地点',budget:'预算',commute:'通勤',layout:'方式',term:'租期',destination:'目的地',time:'时间',people:'同行',question:'想问',usage:'用途',priority:'看重',candidates:'候选'};const source=[s.idea,s.body,s.title].join('\n');const details=(s.analysis?.fields||[]).filter(f=>f.priority==='key').map(f=>{const value=s.confirmed[f.id]&&source.includes(s.confirmed[f.id])?s.confirmed[f.id]:s.analysis.facts.find(x=>x.id===f.id)?.value;return value?`${short[f.id]||f.label}：${value}`:'';}).filter(Boolean);s.coverText=[s.title||s.analysis?.intent||'想听听你的建议',...details].join('\n')+'\f'+C.coverSource(s.idea,s.body);} s.deck=0;s.sync=false;render();notify(`文字配图已更新，共 ${C.paginate(s.coverText).length} 张`);break;
case 'no-sync':s.sync=false;renderAssist();notify('保留原来的配图');break;
case 'undo':undo();break;
case 'force-undo':closeDialog();applyUndo();break;
case 'close-dialog':closeDialog();break;
case 'save':save();break;
case 'publish':cancelAnalysis();s.page=3;s.deck=0;render();notify('模拟发布成功，未发送到真实平台');break;
case 'edit-again':s.page=2;render();analyze();break;
case 'restart':reset();break;
case 'download':download();break;
case 'prev-card':s.deck=Math.max(0,s.deck-1);render();break;
case 'next-card':s.deck=Math.min(C.paginate(s.coverText).length-1,s.deck+1);render();break;
case 'retry':analyze();break;
case 'cover-help':notify('当前聚焦文字发帖。点击已有图片即可返回修改文字。');break;
}});
$('#mode').addEventListener('change',()=>{cancelAnalysis();s.mode=$('#mode').value;s.dismissed=false;s.values={};s.parts={};s.custom={};s.pendingValues=null;s.expanded=false;s.analysis=null;s.error='';render();if(s.page===2)analyze();});$('#reset').onclick=()=>{reset();notify('已重新开始，已保存的本地草稿不受影响');};$('#clear').onclick=()=>{try{localStorage.removeItem(STORE);notify('已清除此浏览器中的草稿');}catch{notify('无法访问浏览器存储');}};$('#restore').onclick=()=>{try{const data=JSON.parse(localStorage.getItem(STORE)||'null');if(!data||data.version!==1||!C.demos.some(d=>d.id===data.state?.demoId)||typeof data.state.idea!=='string')throw Error();cancelAnalysis();s={...blank(),...data.state,analysis:null,expanded:false,conflictReview:false,page:Math.min(data.state.page,2)};if(!data.state.parts){const fields=C.demos.find(d=>d.id===s.demoId).variants[s.variant]?.fields||[];for(const field of fields)if(s.values[field.id]){const draft=C.draftFromFact(field,s.values[field.id],s.demoId);s.values[field.id]=draft.raw;s.parts[field.id]=draft.parts;}}render();if(s.page===2)analyze();notify('已恢复草稿');}catch{notify('没有可恢复的草稿');}};
render();
})();
